name: build

# Builds the LF+ Editor standalone bundles for Windows, Linux and macOS from the SOURCE repo
# (sungle-spec/famc-liquid-foot-usb-editor) at any branch or tag, and — when release_tag is
# given — publishes them as a GitHub Release on THIS repo. PyInstaller can't cross-compile, so
# each OS bundle is produced on its own native runner.
#
# Setup (once): add a fine-grained PAT with *contents: read* on the source repo as the
# The source repo is public, so the checkout needs no token.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source ref to build (branch, tag or SHA of famc-liquid-foot-usb-editor)"
        default: "main"
      release_tag:
        description: "Publish a Release with this tag (e.g. v0.0.3). Leave empty for artifacts only."
        default: ""

env:
  PYTHON_VERSION: "3.12"
  SRC_REPO: sungle-spec/famc-liquid-foot-usb-editor

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4            # this repo: packaging/
      - name: Check out the source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ inputs.ref }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Qt/runtime system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libasound2 \
            libfontconfig1 libfreetype6 libxcb-cursor0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements-dev.txt pillow

      # Overlay the packaging files onto the source tree so the spec's relative paths
      # (lfeditor/, packaging/) work unchanged, then build from inside it.
      - name: Overlay packaging onto the source tree
        shell: bash
        run: cp -R packaging src/packaging

      - name: Resolve version
        id: ver
        shell: bash
        working-directory: src
        run: echo "version=$(python -c 'import lfeditor; print(lfeditor.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Generate app icons
        working-directory: src
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/make_icons.py

      - name: Build with PyInstaller
        working-directory: src
        run: |
          pyinstaller --noconfirm packaging/lfeditor.spec
          pyinstaller --noconfirm packaging/lffirmware.spec

      - name: Resolve loader version
        id: fwver
        shell: bash
        working-directory: src
        run: echo "version=$(python -c 'import lffirmware; print(lffirmware.__version__)')" >> "$GITHUB_OUTPUT"

      # ---- package + smoke-test the frozen bundle, per OS ----
      - name: Package + selftest (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: src
        run: |
          set -e
          ./dist/LFPlusEditor/LFPlusEditor --selftest
          ./dist/LFFirmwareLoader/LFFirmwareLoader --selftest
          bash packaging/linux/make_appimage.sh "${{ steps.ver.outputs.version }}"
          (cd dist && zip -qr "LFFirmwareLoader-${{ steps.fwver.outputs.version }}-linux-x64.zip" LFFirmwareLoader)

      - name: Package + selftest (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: src
        run: |
          set -e
          ./dist/LFPlusEditor/LFPlusEditor --selftest
          ./dist/LFFirmwareLoader/LFFirmwareLoader --selftest
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            "LF+ Editor (native).app" "LFPlusEditor-${{ steps.ver.outputs.version }}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "LF+ Firmware Loader.app" "LFFirmwareLoader-${{ steps.fwver.outputs.version }}-macos-arm64.zip"

      - name: Package + selftest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $p = Start-Process -FilePath "dist/LFPlusEditor/LFPlusEditor.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "selftest failed (exit $($p.ExitCode))"; exit 1 }
          $q = Start-Process -FilePath "dist/LFFirmwareLoader/LFFirmwareLoader.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($q.ExitCode -ne 0) { Write-Error "loader selftest failed (exit $($q.ExitCode))"; exit 1 }
          Compress-Archive -Path "dist/LFPlusEditor" -DestinationPath "dist/LFPlusEditor-$v-windows-x64.zip" -Force
          $fv = "${{ steps.fwver.outputs.version }}"
          Compress-Archive -Path "dist/LFFirmwareLoader" -DestinationPath "dist/LFFirmwareLoader-$fv-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-package
          path: |
            src/dist/*.zip
            src/dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the source repo (version check)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ inputs.ref }}
          path: src
          fetch-depth: 0   # full history, needed to diff against the previous release below
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify release_tag matches __version__
        shell: bash
        working-directory: src
        run: |
          tag="${{ inputs.release_tag }}"; tag="${tag#v}"
          ver="$(python -c 'import lfeditor; print(lfeditor.__version__)')"
          echo "tag=$tag  __version__=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::release_tag v$tag does not match lfeditor.__version__ ($ver) at ref '${{ inputs.ref }}'"
            exit 1
          fi
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          sums="$GITHUB_WORKSPACE/SHA256SUMS.txt"
          : > "$sums"
          cd artifacts
          find . -type f \( -name '*.zip' -o -name '*.AppImage' \) | sort | while read -r f; do
            sha256sum "$f" | awk -v b="$(basename "$f")" '{print $1"  "b}' >> "$sums"
          done
          echo "----- SHA256SUMS.txt -----"
          cat "$sums"
      # Auto-generated audit trail: a bullet list of commit subjects since the previous editor
      # release, so every release documents what actually changed (not just a "built from main"
      # placeholder). The previous release's exact source commit is recovered from a hidden
      # marker this same step embeds in its own release body — see the marker line below — so
      # this works with no separate state to maintain. Only commit SUBJECT lines are ever
      # included; this repo's convention is that commit messages never reference specific user
      # rig/preset data, so the generated notes are safe to publish as-is. Feel free to polish
      # a release's notes by hand afterward (`gh release edit`) — this is a floor, not a ceiling.
      - name: Generate changelog since the previous release
        id: changelog
        shell: bash
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cur_sha="$(git rev-parse HEAD)"
          prev_tag=""
          prev_sha=""
          # Most recent EXISTING vX.Y.Z release on this repo (excludes the firmware-loader
          # pre-release and the tag we're about to publish, since it doesn't exist yet).
          # NOTE: sort by publishedAt, not createdAt — createdAt reflects the underlying git
          # tag's commit date, which is NOT chronological release order (bit us once: it made
          # every 0.0.x release since v0.0.4 look simultaneous, since they share tag history).
          prev_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
            --json tagName,publishedAt,isDraft \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | select(.isDraft==false)] | sort_by(.publishedAt) | last | .tagName // empty')"
          if [ -n "$prev_tag" ]; then
            prev_sha="$(gh release view "$prev_tag" --repo "$GITHUB_REPOSITORY" --json body \
              --jq '.body' | grep -o '<!-- source-sha: [0-9a-f]\{40\} -->' | grep -o '[0-9a-f]\{40\}' || true)"
          fi
          {
            if [ -n "$prev_sha" ] && git cat-file -e "$prev_sha" 2>/dev/null; then
              echo "**Changes since $prev_tag:**"
              echo
              git log --pretty=format:'- %s' "$prev_sha..$cur_sha"
              echo
              echo
            else
              echo "*(No recoverable previous-release marker — this may be the first release using"
              echo "auto-generated notes, or the previous release predates this mechanism.)*"
              echo
            fi
            echo "Built from ${{ env.SRC_REPO }}@${{ inputs.ref }} ($cur_sha)."
            echo "<!-- source-sha: $cur_sha -->"
          } > "$GITHUB_WORKSPACE/RELEASE_NOTES.md"
          echo "----- RELEASE_NOTES.md -----"
          cat "$GITHUB_WORKSPACE/RELEASE_NOTES.md"

      - name: Publish GitHub Release (on this repo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*
            SHA256SUMS.txt
          fail_on_unmatched_files: true
